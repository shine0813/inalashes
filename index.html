<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ina以娜 | 預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --milk-tea-bg: #f8f1eb; --milk-tea-card: rgba(255, 255, 255, 0.9); --milk-tea-accent: #c6ac8f; --milk-tea-dark: #5e503f; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--milk-tea-bg); color: var(--milk-tea-dark); min-height: 100vh; }
        .ins-card { background: var(--milk-tea-card); backdrop-filter: blur(15px); border-radius: 32px; box-shadow: 0 20px 40px rgba(94, 80, 63, 0.06); }
        .step-active { color: var(--milk-tea-dark); font-weight: 700; border-bottom: 2px solid var(--milk-tea-dark); }
        .btn-main { background-color: var(--milk-tea-accent); color: white; transition: 0.3s; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
        .calendar-day.selected { background-color: var(--milk-tea-dark); color: white !important; }
        .calendar-day.disabled { opacity: 0.15; cursor: not-allowed; }
        .time-slot { border: 1px solid #eee; }
        .time-slot.selected { background-color: var(--milk-tea-dark) !important; color: white !important; }
        .time-slot.booked { background-color: #f5f5f5; color: #d1d1d1; cursor: not-allowed; text-decoration: line-through; }
        input[type="checkbox"] { accent-color: var(--milk-tea-accent); width: 1.2rem; height: 1.2rem; }
    </style>
</head>
<body class="p-4">
    <header class="max-w-xl mx-auto flex justify-between items-end mb-8">
        <div><h1 class="text-3xl font-light tracking-widest text-stone-800">ina</h1><p class="text-[10px] tracking-widest opacity-50">以娜·美睫</p></div>
        <button onclick="openAdmin()" class="text-[10px] opacity-40">ADMIN</button>
    </header>

    <main class="max-w-xl mx-auto ins-card p-6 md:p-10 mb-10">
        <nav class="flex justify-between mb-10 text-[9px] text-stone-400 uppercase">
            <span id="step-1" class="step-active pb-1">01. 日期</span><span id="step-2" class="pb-1">02. 時段</span><span id="step-3" class="pb-1">03. 資料</span>
        </nav>

        <section id="view-date">
            <div class="flex justify-center items-center mb-6">
                <h2 class="text-lg font-bold tracking-widest">2026 / 05</h2>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] mb-4 opacity-40"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
        </section>

        <section id="view-time" class="hidden">
            <h2 class="text-lg font-medium mb-1">選擇時段</h2>
            <p id="time-hint" class="text-[10px] opacity-50 mb-8"></p>
            <div id="time-grid" class="grid grid-cols-3 gap-3"></div>
            <div class="mt-12 flex justify-between items-center">
                <button onclick="goToView('date')" class="text-xs opacity-40">← 返回</button>
                <button id="btn-to-info" onclick="goToView('info')" disabled class="btn-main px-12 py-3 rounded-full text-[11px] disabled:opacity-30">下一步</button>
            </div>
        </section>

        <section id="view-info" class="hidden">
            <h2 class="text-lg font-medium mb-1">預約資料</h2>
            <div class="bg-stone-50 p-5 rounded-2xl mb-8 border border-stone-100 text-sm">
                <p class="text-[9px] opacity-40 uppercase">已選時間</p><p id="final-selection"></p>
            </div>
            <div class="space-y-8">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] opacity-40 mb-2">您的稱呼</label>
                        <input type="text" id="cust-name" placeholder="請輸入姓名" class="w-full bg-transparent border-b border-stone-200 py-2 text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] opacity-40 mb-2">出生年月日</label>
                        <input type="text" id="cust-birthday" placeholder="例：19950813" class="w-full bg-transparent border-b border-stone-200 py-2 text-sm focus:outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] opacity-40 mb-3">睫毛款式 (必選一項)</label>
                    <select id="service-select" class="w-full bg-transparent border-b border-stone-200 py-2 text-sm focus:outline-none">
                        <option value="經典單根">經典單根</option>
                        <option value="柔密款">柔密款</option>
                        <option value="小紅書設計款">小紅書設計款</option>
                        <option value="新中式美睫設計款">新中式美睫設計款</option>
                    </select>
                </div>

                <div class="space-y-4">
                    <label class="block text-[10px] opacity-40 mb-3">加購 / 卸除服務 (複選)</label>
                    <div class="grid grid-cols-1 gap-3">
                        <label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer text-sm hover:bg-white transition-colors">
                            <input type="checkbox" value="下睫毛" class="addon-check"> <span>下睫毛</span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded-xl cursor-pointer text-sm hover:bg-white transition-colors">
                            <div class="flex items-center gap-3"><input type="checkbox" value="本店卸除($200)" class="addon-check"><span>本店卸除</span></div><span class="opacity-40">$200</span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded-xl cursor-pointer text-sm hover:bg-white transition-colors">
                            <div class="flex items-center gap-3"><input type="checkbox" value="本店卸除重接(Free)" class="addon-check"><span>本店卸除重接</span></div><span class="opacity-40 text-stone-400">Free</span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded-xl cursor-pointer text-sm hover:bg-white transition-colors">
                            <div class="flex items-center gap-3"><input type="checkbox" value="他店卸除($400)" class="addon-check"><span>他店卸除</span></div><span class="opacity-40">$400</span>
                        </label>
                        <label class="flex items-center justify-between p-3 border rounded-xl cursor-pointer text-sm hover:bg-white transition-colors">
                            <div class="flex items-center gap-3"><input type="checkbox" value="他店卸除重接($300)" class="addon-check"><span>他店卸除重接</span></div><span class="opacity-40">$300</span>
                        </label>
                    </div>
                </div>

                <button onclick="finishBooking()" class="w-full btn-main py-4 rounded-full text-[11px] font-bold">確認預約並跳轉 Line</button>
            </div>
        </section>
    </main>

    <div id="admin-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[32px] w-full max-w-md p-8">
            <div id="admin-auth">
                <h3 class="text-lg mb-6 text-center">管理員登入</h3>
                <input type="password" id="admin-pwd-input" class="w-full border-b mb-6 text-center p-2 focus:outline-none">
                <button onclick="verifyAdmin()" class="w-full btn-main py-3 rounded-xl">驗證</button>
            </div>
            <div id="admin-content" class="hidden">
                <h3 class="font-medium mb-6">預約清單</h3>
                <div id="booking-list" class="space-y-3 max-h-[400px] overflow-y-auto"></div>
                <button onclick="closeAdmin()" class="w-full mt-6 py-3 text-xs opacity-40">關閉</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PWD = "0813"; const LINE_URL = "https://lin.ee/8nG0CEA";
        
        const TODAY = new Date();
        TODAY.setHours(0, 0, 0, 0);
        const FIX_YEAR = 2026;
        const FIX_MONTH = 4; // 5月

        // 特殊日期設定 (FULL 代表全天關閉，陣列代表關閉時段)
        const OFF = {
            "2026-05-04": ["10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00"],
            "2026-05-05": "FULL",
            "2026-05-06": "FULL",
            "2026-05-07": "FULL",
            "2026-05-08": "FULL",
            "2026-05-09": "FULL",
            "2026-05-10": "FULL",
            "2026-05-11": ["10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00"],
            "2026-05-16": "FULL", 
            "2026-05-17": "FULL", 
            "2026-05-21": "FULL", 
            "2026-05-22": ["11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00"], 
            "2026-05-23": "FULL",
            "2026-05-24": "FULL",
            "2026-05-25": "FULL",
            "2026-05-26": "FULL", 
            "2026-05-27": "FULL", // 新增 5/27 全天關閉
            "2026-05-28": "FULL", 
            "2026-05-31": ["14:00", "14:30", "15:00", "15:30", "16:00", "16:30"] 
        };

        let state = { currentDate: null, currentTime: null, bookings: JSON.parse(localStorage.getItem('ina_b') || '[]') };

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid'); grid.innerHTML = '';
            const first = new Date(FIX_YEAR, FIX_MONTH, 1).getDay();
            const last = new Date(FIX_YEAR, FIX_MONTH + 1, 0).getDate();
            
            for (let i=0; i<first; i++) grid.appendChild(Object.assign(document.createElement('div'), {className:'h-10'}));
            
            for (let d=1; d<=last; d++) {
                const date = new Date(FIX_YEAR, FIX_MONTH, d);
                date.setHours(0, 0, 0, 0);
                const s = `${FIX_YEAR}-${(FIX_MONTH+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                const el = document.createElement('div'); el.innerText = d; el.className = 'calendar-day relative h-10 text-xs';
                
                if (date <= TODAY || OFF[s] === "FULL") {
                    el.classList.add('disabled');
                } else {
                    if (state.currentDate === s) el.classList.add('selected');
                    el.onclick = () => { state.currentDate = s; state.currentTime = null; renderCalendar(); renderTime(); goToView('time'); };
                }
                grid.appendChild(el);
            }
        }

        function renderTime() {
            const grid = document.getElementById('time-grid'); grid.innerHTML = '';
            const d = new Date(state.currentDate); 
            const isW = d.getDay()===0||d.getDay()===6;
            document.getElementById('time-hint').innerText = state.currentDate;
            
            let start = isW ? 14 : 10;
            let end = isW ? 17 : 15;

            for (let h=start; h<=end; h++) {
                ["00","30"].forEach(m => {
                    if (h===end && m==="30") return;
                    const t = `${h.toString().padStart(2,'0')}:${m}`;
                    const isOff = OFF[state.currentDate]?.includes?.(t);
                    const el = document.createElement('div'); el.innerText = t;
                    el.className = `time-slot py-3 text-center rounded-xl text-xs cursor-pointer ${isOff?'booked':'bg-white'}`;
                    if (!isOff) {
                        if (state.currentTime === t) el.classList.add('selected');
                        el.onclick = () => { state.currentTime = t; document.getElementById('btn-to-info').disabled = false; renderTime(); };
                    }
                    grid.appendChild(el);
                });
            }
        }

        function finishBooking() {
            const n = document.getElementById('cust-name').value;
            const bth = document.getElementById('cust-birthday').value;
            if (!n || !bth) return alert("請填寫姓名與生日唷！");
            const s = document.getElementById('service-select').value;
            const addons = Array.from(document.querySelectorAll('.addon-check:checked')).map(cb => cb.value);
            const combinedServices = [s, ...addons].join(' + ');
            const b = { id:Date.now(), name:n, birthday:bth, date:state.currentDate, time:state.currentTime, service:combinedServices };
            state.bookings.push(b); localStorage.setItem('ina_b', JSON.stringify(state.bookings));
            const msg = `預約通知：\n姓名：${n}\n生日：${bth}\n時間：${state.currentDate} ${state.currentTime}\n項目：${combinedServices}`;
            const el = document.createElement('textarea'); el.value = msg; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            alert("預約資訊已複製！請至 Line 貼上並送出"); window.location.href = LINE_URL;
        }

        function goToView(v) {
            ['date','time','info'].forEach(i => document.getElementById('view-'+i).classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            if (v==='info') document.getElementById('final-selection').innerText = `${state.currentDate} ${state.currentTime}`;
        }
        function openAdmin() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }
        function verifyAdmin() { if (document.getElementById('admin-pwd-input').value === ADMIN_PWD) { document.getElementById('admin-auth').classList.add('hidden'); document.getElementById('admin-content').classList.remove('hidden'); renderList(); } else alert("密碼錯誤"); }
        function renderList() {
            const l = document.getElementById('booking-list'); l.innerHTML = '';
            state.bookings.forEach(b => {
                const d = document.createElement('div'); d.className = "bg-stone-50 p-3 rounded-xl flex justify-between text-[10px] mb-2 border";
                d.innerHTML = `<div><p class="font-bold">${b.date} ${b.time}</p><p>${b.name}(${b.birthday}) - ${b.service}</p></div><button onclick="del(${b.id})" class="text-red-400 ml-2">刪</button>`;
                l.appendChild(d);
            });
        }
        function del(id) { state.bookings = state.bookings.filter(b => b.id!==id); localStorage.setItem('ina_b', JSON.stringify(state.bookings)); renderList(); }
        window.onload = renderCalendar;
    </script>
</body>
</html>
